<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本加密工具</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --danger: #e74c3c;
            --success: #10b981;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --border-focus: #4f46e5;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 20px 40px -8px rgba(0,0,0,0.12), 0 8px 16px -6px rgba(0,0,0,0.06);
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
                'Noto Sans SC', 'Hiragino Sans GB', sans-serif;
            background: linear-gradient(135deg, #e8ecf1 0%, #dce3ea 25%, #eef1f5 50%, #e4e9f0 75%, #e8ecf1 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            padding: 36px 32px 32px;
            border: 1px solid rgba(226,232,240,0.8);
            backdrop-filter: blur(4px);
        }
        .header {
            text-align: center;
            margin-bottom: 28px;
        }
        .header h1 {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .section {
            margin-bottom: 20px;
        }
        .section label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text);
            margin-bottom: 7px;
        }
        .input-row {
            position: relative;
            display: flex;
            align-items: center;
        }
        input[type="password"],
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            font-size: 0.93rem;
            font-family: inherit;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: #fafbfc;
            color: var(--text);
            transition: all var(--transition);
            resize: vertical;
            line-height: 1.5;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.08);
            background: #fff;
        }
        textarea {
            min-height: 110px;
            max-height: 280px;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 6px 10px;
            color: #64748b;
            transition: color var(--transition);
            z-index: 2;
            border-radius: 6px;
        }
        .toggle-password:hover {
            color: #4f46e5;
            background: rgba(79,70,229,0.04);
        }
        .btn-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            min-width: 100px;
            padding: 13px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            letter-spacing: 0.2px;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            white-space: nowrap;
        }
        .btn-encrypt {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 8px rgba(79,70,229,0.25);
        }
        .btn-encrypt:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 16px rgba(79,70,229,0.35);
            transform: translateY(-1px);
        }
        .btn-decrypt {
            background: #fff;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }
        .btn-decrypt:hover {
            background: var(--primary-light);
            border-color: var(--primary-hover);
            color: var(--primary-hover);
            transform: translateY(-1px);
        }
        .btn-copy {
            flex: 0 0 auto;
            padding: 10px 16px;
            font-size: 0.8rem;
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 500;
        }
        .btn-copy:hover { background: #e2e8f0; }
        .btn-copy.copied {
            background: #d1fae5;
            border-color: #10b981;
            color: #059669;
        }
        .btn-clear {
            flex: 0 0 auto;
            padding: 10px 14px;
            font-size: 0.8rem;
            background: transparent;
            color: #94a3b8;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 500;
        }
        .btn-clear:hover {
            color: #e74c3c;
            background: #fef2f2;
            border-color: #fecaca;
        }
        .output-row {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        .output-row textarea {
            flex: 1;
            background: #f8fafc;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.82rem;
            word-break: break-all;
        }
        .status {
            text-align: center;
            font-size: 0.82rem;
            font-weight: 500;
            min-height: 22px;
            margin-top: 6px;
            transition: all var(--transition);
        }
        .status.success { color: #059669; }
        .status.error { color: #e74c3c; }
        .status.info { color: #64748b; }

        @media (max-width: 600px) {
            .container { padding: 24px 16px 20px; }
            .header h1 { font-size: 1.35rem; }
            .btn-row { flex-direction: column; }
            .btn { width: 100%; }
            .btn-copy, .btn-clear { flex: 1; text-align: center; }
            .output-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>文本加密工具</h1>
        </div>

        <div class="section">
            <label for="password">密钥</label>
            <div class="input-row">
                <input type="password" id="password" placeholder="输入任意长度密钥" autocomplete="off">
                <button class="toggle-password" id="togglePwd" type="button">显示</button>
            </div>
        </div>

        <div class="section">
            <label for="plaintext">明文</label>
            <textarea id="plaintext" placeholder="输入需要加密的内容"></textarea>
        </div>

        <div class="btn-row">
            <button class="btn btn-encrypt" id="btnEncrypt" type="button">加密</button>
            <button class="btn btn-decrypt" id="btnDecrypt" type="button">解密</button>
            <button class="btn btn-clear" id="btnClear" type="button">清空</button>
        </div>

        <div class="section" style="margin-top: 16px;">
            <label for="ciphertext">密文</label>
            <div class="output-row">
                <textarea id="ciphertext" placeholder="加密结果或粘贴密文" readonly></textarea>
                <button class="btn btn-copy" id="btnCopy" type="button">复制</button>
            </div>
        </div>

        <div class="status" id="status"></div>
    </div>
